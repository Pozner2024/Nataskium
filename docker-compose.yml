services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is not set: copy .env.example to .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set: set it in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is not set: copy .env.example to .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # С PostgreSQL 18 данные лежат в /var/lib/postgresql/18/docker: монтируется родительский каталог
      - nataskium-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nataskium-db:
