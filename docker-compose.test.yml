# Тестовая БД для интеграционных тестов apps/api: docker compose -f docker-compose.test.yml up -d
# Отдельный файл: compose подставляет переменные во всём файле, а docker-compose.yml без корневого .env не запустится
name: nataskium-test

services:
  db-test:
    image: postgres:18.6-alpine3.24
    # Только env_file: секция environment перекрыла бы его значения
    env_file: .env.test
    ports:
      - "127.0.0.1:5433:5432"
    # Данные только в памяти: после остановки контейнера ничего не остаётся
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15
